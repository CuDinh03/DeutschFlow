# ============================================================
# Nginx — DeutschFlow tự host (VM tại nhà, sau Cloudflare Tunnel)
#
# Đường vào DUY NHẤT: Cloudflare → cloudflared (chạy trên chính VM) → nginx 127.0.0.1:80.
# Không 443/certbot: TLS kết thúc ở Cloudflare. Không cổng nào mở ra LAN/internet.
#
#   sudo cp deploy/self-host/deutschflow.nginx.conf /etc/nginx/sites-available/deutschflow
#   sudo ln -sf /etc/nginx/sites-available/deutschflow /etc/nginx/sites-enabled/deutschflow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   (lần đầu) sudo deploy/self-host/install-nginx.sh — tạo /etc/nginx/deutschflow-upstreams/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bản EC2 cũ: docker/deutschflow.nginx.conf (giữ để đối chiếu rate-limit/actuator).
# ============================================================

# ── Upstream blue-green ──────────────────────────────────────
# Mỗi file một dòng `upstream df_backend { server 127.0.0.1:8080; }` (hoặc :8081). Script
# deploy-*-vm.sh ghi lại file rồi `nginx -s reload` ⇒ đổi màu tức thì, request đang chạy vẫn xong.
include /etc/nginx/deutschflow-upstreams/*.conf;

# ── IP thật của client (AC-SELFHOST-05) ──────────────────────
# Mọi kết nối tới nginx đều đến từ cloudflared trên 127.0.0.1 ⇒ $remote_addr luôn là 127.0.0.1.
# Thiếu khối này là MỌI người dùng chung một xô rate-limit ⇒ 429 hàng loạt. Chỉ tin
# CF-Connecting-IP khi kết nối đến từ loopback (tức là từ cloudflared) — không ai khác vào được.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# Tunnel nói http với nginx, nhưng trình duyệt dùng https: lấy proto từ Cloudflare.
map $http_x_forwarded_proto $df_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $df_connection_upgrade {
    default upgrade;
    ""      close;
}
#
# 🏫 Ngưỡng chọn THOÁNG có chủ đích: đây là sản phẩm B2B cho trường/trung tâm, cả một lớp ngồi
#    sau MỘT địa chỉ NAT của trường (hoặc CGNAT nhà mạng) là chuyện thường. Chặn oan cả lớp tệ
#    hơn nhiều so với để lọt một kẻ tấn công đơn lẻ — lớp chặn tinh nằm ở tầng app.
limit_req_zone  $binary_remote_addr zone=df_auth:10m rate=3r/s;
limit_req_zone  $binary_remote_addr zone=df_api:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=df_conn:10m;

# Mặc định nginx trả 503 cho limit_req — sai ngữ nghĩa và làm client/retry hiểu nhầm là server
# lỗi. 429 mới đúng, và khớp với 429 mà app trả cho rate-limit tầng ứng dụng.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;


# ── Frontend: mydeutschflow.com, www ─────────────────────────
server {
    listen 127.0.0.1:80;
    server_name mydeutschflow.com www.mydeutschflow.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "microphone=(self), camera=()";

    client_max_body_size 16M;

    limit_req  zone=df_api burst=100 nodelay;
    limit_conn df_conn 150;

    location / {
        proxy_pass http://df_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $df_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $df_forwarded_proto;
    }
}

# ── Backend API: api.mydeutschflow.com ──────────────────────
# Blue-green: df_backend trỏ 8080 (blue) hoặc 8081 (green) — deploy-backend-vm.sh đổi.
server {
    listen 127.0.0.1:80;
    server_name api.mydeutschflow.com;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Khớp spring.servlet.multipart (25MB); tệp lớn hơn PUT thẳng lên R2 bằng presigned URL.
    client_max_body_size 25M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $df_forwarded_proto;

    limit_req zone=df_api burst=100 nodelay;
    limit_conn df_conn 150;

    location = /actuator/health {
        proxy_pass http://df_backend;
    }
    location /actuator/ {
        deny all;
    }

    location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password)$ {
        limit_req zone=df_auth burst=30 nodelay;
        limit_req zone=df_api  burst=100 nodelay;
        proxy_pass http://df_backend;
    }

    location / {
        proxy_pass http://df_backend;
        # SSE: tắt buffering để stream realtime
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}

# Host lạ (gõ IP, hostname khác) → đóng kết nối.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 444;
}
