name: Backend CI/CD

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  # CỐ Ý không lọc `paths` ở pull_request. `🔨 Compile` và `🧪 Unit Tests` là
  # required status check của nhánh main; khi workflow bị path-filter chặn thì
  # GitHub KHÔNG tạo check run nào cả, hai check đó treo "pending" vĩnh viễn và
  # mọi PR không đụng backend đều không tài nào merge được (PR #284 kẹt đúng vậy,
  # #283 phải admin-override). Job bị skip bằng `if:` thì ngược lại: check run VẪN
  # được báo cáo với conclusion "skipped", và branch protection chấp nhận skipped.
  # Nên trigger luôn chạy, còn bỏ qua hay không do job `changes` bên dưới quyết định.
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 0: PR này có đụng backend không? ───────────────────────
  # Thay cho `paths:` đã gỡ ở trigger — xem ghi chú tại khối `on:` bên trên.
  changes:
    name: 🔍 Backend changed?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Đủ để có cả hai cha của merge commit (^1 = base, ^2 = head của PR).
          fetch-depth: 2

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Ngoài pull_request (tức push) trigger vẫn còn `paths: backend/**`,
          # nên chạy được tới đây nghĩa là backend đã có thay đổi.
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "→ event=$EVENT, không phải PR: chạy đầy đủ."
            exit 0
          fi

          # So hai cha của merge commit. Cố tình dùng HAI chấm chứ không ba chấm:
          # nếu base đã chạy lên trước thì kết quả THỪA chứ không THIẾU. Chạy test
          # backend dư thì chỉ tốn phút CI, còn bỏ qua nhầm lúc backend thật sự đổi
          # là để lọt lỗi ra main.
          if git diff --name-only HEAD^1 HEAD^2 | grep -qE '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "→ PR có đụng backend/: chạy đầy đủ."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "→ PR không đụng backend/: bỏ qua Compile + Unit Tests (báo cáo skipped)."
          fi

  # ─── Stage 1: Compile ─────────────────────────────────────────────
  compile:
    name: 🔨 Compile
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile (skip tests)
        working-directory: backend
        run: ./mvnw -B compile -DskipTests

  # ─── Stage 2: Unit Tests ──────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    needs: [changes, compile]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests (Surefire — excludes *IntegrationTest, *ContractTest)
        working-directory: backend
        run: ./mvnw -B test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ─── Stage 3: Integration Tests (main only) ───────────────────────
  integration-tests:
    name: 🐘 Integration Tests
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ubuntu-latest có Docker daemon sẵn — Testcontainers dùng trực tiếp
      - name: Run integration tests (Failsafe — Testcontainers)
        working-directory: backend
        run: ./mvnw -B verify -DskipUnitTests=true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/target/failsafe-reports/
          retention-days: 7

  # ─── Stage 4: Auto Deploy to EC2 ─────────────────────────────────
  # Self-hosted runner chạy TRÊN EC2 — kết nối ra GitHub, không cần inbound SSH
  # Prereq: Cài runner trên EC2 theo hướng dẫn DEPLOYMENT.md
  deploy:
    name: 🚀 Deploy to EC2
    needs: unit-tests
    # DISABLED: backend deploys via deploy-backend.sh (blue-green + .env.production sync). Pushing
    # main no longer auto-deploys here — avoids a double-deploy race on port 8080. Re-enable with
    # `github.ref == 'refs/heads/main' && github.event_name == 'push'` for CI-driven deploy.
    if: false
    runs-on: [self-hosted, ec2]
    timeout-minutes: 12
    steps:
      - name: Build & restart container
        run: |
          set -e
          cd /home/ubuntu/DeutschFlow
          git pull origin main

          echo "🔨 Building Docker image..."
          sudo docker build -t deutschflow-backend:latest ./backend

          echo "♻️ Restarting container..."
          sudo docker rm -f deutschflow-backend 2>/dev/null || true
          sudo docker run -d \
            --name deutschflow-backend \
            --memory="1500m" \
            --cpus="1.8" \
            --env-file /home/ubuntu/DeutschFlow/.env.production \
            -p 8080:8080 \
            --restart unless-stopped \
            deutschflow-backend:latest

          echo "⏳ Waiting for Spring Boot..."
          sleep 45

          echo "🔍 Health check..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
          [ "$HTTP" -eq 200 ] || { sudo docker logs deutschflow-backend --tail 30; exit 1; }
          echo "✅ Deploy OK — HTTP $HTTP"
          sudo docker stats deutschflow-backend --no-stream --format "CPU: {{.CPUPerc}} | MEM: {{.MemUsage}}"
