name: Frontend CI

on:
  # `push` vẫn lọc nhánh: mỗi lần push lên nhánh feature đã có sự kiện `pull_request` bên dưới lo,
  # chạy cả hai chỉ tốn đôi CI cho cùng một commit.
  #
  # Danh sách này còn nợ dọn, nhưng để nguyên vì gỡ nhầm thì mất cổng: `feat/onboarding-v3` nay ĐÃ merge
  # trọn vào main (kiểm 02/09 bằng `git merge-base --is-ancestor`) nên gỡ được; `dev` thì KHÔNG — nó vẫn
  # còn 19 commit chưa lên main, dù mobile-ci.yml đã gỡ `dev` với lý do "nhánh chết".
  push:
    branches: [ "master", "main", "dev", "feat/onboarding-v3" ]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/deutschflow/user/mentor/**'
      - '.github/workflows/frontend-ci.yml'

  # `pull_request` KHÔNG lọc base — cố ý.
  #
  # `branches:` ở đây chỉ khớp nhánh ĐÍCH, nên mọi PR xếp chồng (PR có base là một nhánh feature
  # khác) rơi ra ngoài và workflow này không hề chạy. Nó không đỏ, nó VẮNG MẶT: PR vẫn hiện
  # CLEAN/MERGEABLE vì Backend CI và Security CI (cả hai để `pull_request:` trần) vẫn xanh, nên
  # nhìn qua tưởng đã qua cổng đầy đủ. Ngăn xếp 5 PR ngày 02/09/2026 (#445→#449→#455→#457→#458)
  # merge được mà chưa từng chạy tsc, lint, i18n guard hay bản build thật một lần nào trên CI —
  # đúng lúc cần nhất, vì bốn PR trong đó sửa frontend.
  #
  # CỐ Ý không lọc `paths` ở đây (gỡ 05/09, đợt 0 kế hoạch nâng cấp mobile). `build-and-lint` là
  # required status check của nhánh main; khi workflow bị path-filter chặn thì GitHub KHÔNG tạo check
  # run nào cả, check đó treo "Expected" vĩnh viễn và mọi PR không đụng frontend đều không tài nào
  # merge được (backend-ci từng dính đúng vậy ở PR #284, #283 phải admin-override). Job bị skip bằng
  # `if:` thì ngược lại: check run VẪN được báo cáo với conclusion "skipped", và branch protection
  # chấp nhận skipped. Nên trigger luôn chạy, còn bỏ qua hay không do job `changes` bên dưới quyết định.
  # Bộ đường dẫn theo dõi giữ nguyên ở job `changes`: ngoài `frontend/**` còn catalog mentor ở backend
  # vì `src/__tests__/mentorMeta.test.ts` đọc thẳng FixedMentorResolver.java làm nguồn chuẩn — một PR
  # CHỈ đụng backend mà thêm mentor sẽ không kích hoạt guard; đó chính là hình dạng của commit 63e406cb,
  # thứ đã để 6 mentor nhập môn trôi mất trên web. Và chính file workflow này cũng nằm trong danh sách,
  # để sửa cổng thì cổng tự chạy.
  #
  # `edited` có mặt vì một lý do duy nhất: khi PR base được merge, GitHub trỏ lại base bằng sự kiện
  # `edited` — không phải `synchronize` — nên nếu thiếu, PR xếp chồng được retarget sang main mà KHÔNG
  # chạy lại cổng nào. Trước 05/09 job lọc bỏ lần `edited` chỉ sửa tiêu đề/mô tả để tiết kiệm CI; nay
  # KHÔNG lọc nữa: một lần `edited` bị lọc sẽ đẻ ra check run "skipped" đè lên kết quả đỏ trước đó trên
  # cùng commit, tức là sửa mô tả PR là đủ để qua cổng. Tốn vài phút CI cho mỗi lần sửa mô tả rẻ hơn
  # một lỗ hổng như thế.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # ─── Stage 0: PR này có đụng frontend không? ──────────────────────────
  # Thay cho `paths:` đã gỡ ở trigger — xem ghi chú tại khối `on:` bên trên. Cùng mẫu backend-ci.yml.
  changes:
    name: 🔍 Frontend changed?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Đủ để có cả hai cha của merge commit (^1 = base, ^2 = head của PR).
          fetch-depth: 2

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Ngoài pull_request (tức push) trigger vẫn còn `paths: frontend/**`,
          # nên chạy được tới đây nghĩa là frontend đã có thay đổi.
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "→ event=$EVENT, không phải PR: chạy đầy đủ."
            exit 0
          fi

          # So hai cha của merge commit. Cố tình dùng HAI chấm chứ không ba chấm:
          # nếu base đã chạy lên trước thì kết quả THỪA chứ không THIẾU. Dựng
          # frontend dư thì chỉ tốn phút CI, còn bỏ qua nhầm lúc frontend thật sự
          # đổi là để lọt lỗi ra main.
          if git diff --name-only HEAD^1 HEAD^2 | grep -qE '^(frontend/|backend/src/main/java/com/deutschflow/user/mentor/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "→ PR có đụng frontend/ (hoặc catalog mentor / workflow này): chạy đầy đủ."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "→ PR không đụng frontend/: bỏ qua build-and-lint (báo cáo skipped)."
          fi

  build-and-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      # Two guards, deliberately both: check-i18n-v2 proves vi/en/de agree with each other, and
      # check-i18n-usage proves the source can actually resolve what it asks for. Parity alone is
      # blind to a namespace missing from all three locales — it stays balanced, reports "in sync",
      # and the page renders the raw key path to users. That blind spot shipped twice.
      - name: i18n Catalog Guards
        working-directory: ./frontend
        run: npm run check:i18n

      # Design-token ratchet (Wave 0, W0-C1): chặn literal/arbitrary design value MỚI trên surface
      # /v2 so với design-token-baseline.json. Baseline chỉ được giảm; CI và local chạy CÙNG lệnh.
      - name: Design Token Ratchet
        working-directory: ./frontend
        run: npm run check:design-tokens

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: i18n Hardcoded String Check
        run: |
          chmod +x scripts/i18n/check_i18n.py
          ./scripts/i18n/check_i18n.py || (echo "i18n Check Failed: Hardcoded strings found! Please extract them using t() hook." && exit 1)

      # Typecheck and unit tests never execute static generation, so a page can pass every
      # gate above and still emit i18n resolution errors (MISSING_MESSAGE) or fail outright
      # when the production artifact is built. Build the real artifact here and treat
      # MISSING_MESSAGE as a failure — next-intl logs it but exits 0, and the raw key path
      # leaks into the rendered page.
      - name: Production Build (gate on MISSING_MESSAGE)
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -n "MISSING_MESSAGE" build.log; then
            echo "::error::next-intl MISSING_MESSAGE in production build — an i18n key fails to resolve (see lines above)"
            exit 1
          fi
