name: Frontend CI

on:
  push:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      # Two guards, deliberately both: check-i18n-v2 proves vi/en/de agree with each other, and
      # check-i18n-usage proves the source can actually resolve what it asks for. Parity alone is
      # blind to a namespace missing from all three locales — it stays balanced, reports "in sync",
      # and the page renders the raw key path to users. That blind spot shipped twice.
      - name: i18n Catalog Guards
        working-directory: ./frontend
        run: npm run check:i18n

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: i18n Hardcoded String Check
        run: |
          chmod +x scripts/i18n/check_i18n.py
          ./scripts/i18n/check_i18n.py || (echo "i18n Check Failed: Hardcoded strings found! Please extract them using t() hook." && exit 1)

      # Typecheck and unit tests never execute static generation, so a page can pass every
      # gate above and still emit i18n resolution errors (MISSING_MESSAGE) or fail outright
      # when the production artifact is built. Build the real artifact here and treat
      # MISSING_MESSAGE as a failure — next-intl logs it but exits 0, and the raw key path
      # leaks into the rendered page.
      - name: Production Build (gate on MISSING_MESSAGE)
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -n "MISSING_MESSAGE" build.log; then
            echo "::error::next-intl MISSING_MESSAGE in production build — an i18n key fails to resolve (see lines above)"
            exit 1
          fi
