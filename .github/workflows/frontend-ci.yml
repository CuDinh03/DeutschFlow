name: Frontend CI

on:
  # `push` vẫn lọc nhánh: mỗi lần push lên nhánh feature đã có sự kiện `pull_request` bên dưới lo,
  # chạy cả hai chỉ tốn đôi CI cho cùng một commit. `feat/onboarding-v3` là nhánh dài hạn của dự án
  # onboarding onb_v3 (các đợt GĐ 1–8 push thẳng vào đó); gỡ khi nhánh ấy merge xong.
  push:
    branches: [ "master", "main", "dev", "feat/onboarding-v3" ]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/deutschflow/user/mentor/**'
      - '.github/workflows/frontend-ci.yml'

  # `pull_request` KHÔNG lọc base — cố ý.
  #
  # `branches:` ở đây chỉ khớp nhánh ĐÍCH, nên mọi PR xếp chồng (PR có base là một nhánh feature
  # khác) rơi ra ngoài và workflow này không hề chạy. Nó không đỏ, nó VẮNG MẶT: PR vẫn hiện
  # CLEAN/MERGEABLE vì Backend CI và Security CI (cả hai để `pull_request:` trần) vẫn xanh, nên
  # nhìn qua tưởng đã qua cổng đầy đủ. Ngăn xếp 5 PR ngày 02/09/2026 (#445→#449→#455→#457→#458)
  # merge được mà chưa từng chạy tsc, lint, i18n guard hay bản build thật một lần nào trên CI —
  # đúng lúc cần nhất, vì bốn PR trong đó sửa frontend.
  #
  # `paths` thì giữ: PR chỉ đụng backend không cần dựng frontend. Ngoài `frontend/**` còn theo dõi
  # catalog mentor ở backend vì `src/__tests__/mentorMeta.test.ts` đọc thẳng FixedMentorResolver.java
  # làm nguồn chuẩn — một PR CHỈ đụng backend mà thêm mentor sẽ không kích hoạt workflow này và guard
  # trở thành vô dụng; đó chính là hình dạng của commit 63e406cb, thứ đã để 6 mentor nhập môn trôi
  # mất trên web. Và chính file workflow này cũng nằm trong danh sách, để sửa cổng thì cổng tự chạy.
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/deutschflow/user/mentor/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      # Two guards, deliberately both: check-i18n-v2 proves vi/en/de agree with each other, and
      # check-i18n-usage proves the source can actually resolve what it asks for. Parity alone is
      # blind to a namespace missing from all three locales — it stays balanced, reports "in sync",
      # and the page renders the raw key path to users. That blind spot shipped twice.
      - name: i18n Catalog Guards
        working-directory: ./frontend
        run: npm run check:i18n

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: i18n Hardcoded String Check
        run: |
          chmod +x scripts/i18n/check_i18n.py
          ./scripts/i18n/check_i18n.py || (echo "i18n Check Failed: Hardcoded strings found! Please extract them using t() hook." && exit 1)

      # Typecheck and unit tests never execute static generation, so a page can pass every
      # gate above and still emit i18n resolution errors (MISSING_MESSAGE) or fail outright
      # when the production artifact is built. Build the real artifact here and treat
      # MISSING_MESSAGE as a failure — next-intl logs it but exits 0, and the raw key path
      # leaks into the rendered page.
      - name: Production Build (gate on MISSING_MESSAGE)
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -n "MISSING_MESSAGE" build.log; then
            echo "::error::next-intl MISSING_MESSAGE in production build — an i18n key fails to resolve (see lines above)"
            exit 1
          fi
