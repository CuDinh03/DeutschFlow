name: Mobile CI

on:
  # `push` vẫn lọc nhánh: nhánh feature đã có sự kiện `pull_request` bên dưới lo, chạy cả hai chỉ tốn
  # đôi CI cho cùng một commit. `dev` (nhánh chết) và `feat/onboarding-v3` (đã merge trọn vào main) đã
  # được gỡ 02/09 theo nợ ghi từ 30/08 — giữ lại chỉ gây nhiễu.
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

  # `pull_request` KHÔNG lọc base — cố ý, xem frontend-ci.yml cho cùng lý do.
  #
  # `branches:` chỉ khớp nhánh ĐÍCH, nên PR xếp chồng (base là một nhánh feature khác) rơi ra ngoài và
  # workflow này không hề chạy. Nó không đỏ, nó VẮNG MẶT: PR vẫn hiện CLEAN/MERGEABLE vì Backend CI và
  # Security CI (cả hai để `pull_request:` trần) vẫn xanh. Với mobile thì mất mát nặng hơn frontend —
  # `type-check-and-test` là cổng duy nhất chặn lỗi TypeScript trôi vào một bản build native, thứ chỉ
  # lộ ra khi đã lên TestFlight.
  #
  # CỐ Ý không lọc `paths` ở đây (gỡ 05/09, đợt 0 kế hoạch nâng cấp mobile). `🧪 Type Check & Unit
  # Tests` là required status check của nhánh main; khi workflow bị path-filter chặn thì GitHub KHÔNG
  # tạo check run nào cả, check đó treo "Expected" vĩnh viễn và mọi PR không đụng mobile đều không tài
  # nào merge được (backend-ci từng dính đúng vậy ở PR #284, #283 phải admin-override). Job bị skip
  # bằng `if:` thì ngược lại: check run VẪN được báo cáo với conclusion "skipped", và branch protection
  # chấp nhận skipped. Nên trigger luôn chạy, còn bỏ qua hay không do job `changes` bên dưới quyết định.
  #
  # `edited` có mặt vì một lý do duy nhất: khi PR base được merge, GitHub trỏ lại base bằng sự kiện
  # `edited` — không phải `synchronize` — nên nếu thiếu, PR xếp chồng được retarget sang main mà KHÔNG
  # chạy lại cổng nào. Trước 05/09 các job lọc bỏ lần `edited` chỉ sửa tiêu đề/mô tả để tiết kiệm CI;
  # nay KHÔNG lọc nữa: một lần `edited` bị lọc sẽ đẻ ra check run "skipped" đè lên kết quả đỏ trước đó
  # trên cùng commit, tức là sửa mô tả PR là đủ để qua cổng. Tốn vài phút CI cho mỗi lần sửa mô tả rẻ
  # hơn một lỗ hổng như thế.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 0: PR này có đụng mobile không? ────────────────────────────
  # Thay cho `paths:` đã gỡ ở trigger — xem ghi chú tại khối `on:` bên trên. Cùng mẫu backend-ci.yml.
  changes:
    name: 🔍 Mobile changed?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Đủ để có cả hai cha của merge commit (^1 = base, ^2 = head của PR).
          fetch-depth: 2

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Ngoài pull_request (tức push) trigger vẫn còn `paths: mobile/**`,
          # nên chạy được tới đây nghĩa là mobile đã có thay đổi.
          if [ "$EVENT" != "pull_request" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "→ event=$EVENT, không phải PR: chạy đầy đủ."
            exit 0
          fi

          # So hai cha của merge commit. Cố tình dùng HAI chấm chứ không ba chấm:
          # nếu base đã chạy lên trước thì kết quả THỪA chứ không THIẾU. Chạy test
          # mobile dư thì chỉ tốn phút CI, còn bỏ qua nhầm lúc mobile thật sự đổi
          # là để lọt lỗi TypeScript vào bản build native.
          if git diff --name-only HEAD^1 HEAD^2 | grep -qE '^(mobile/|\.github/workflows/mobile-ci\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "→ PR có đụng mobile/: chạy đầy đủ."
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
            echo "→ PR không đụng mobile/: bỏ qua Type Check & Unit Tests + Fingerprint (báo cáo skipped)."
          fi

  type-check-and-test:
    name: 🧪 Type Check & Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Unit Tests
        working-directory: ./mobile
        run: npm test

  # Soát 02/09 (F-5): chuỗi OTA từng đứt ÂM THẦM 3 tuần vì không gì canh runtime
  # fingerprint — PR đổi dep native (vd Sentry 8.17→8.23) trông y như PR JS thường,
  # nhưng OTA từ sau nó không tới được build đang phát hành nữa.
  #
  # Viết lại 05/09 (đợt 0 plan nâng cấp mobile, AC-MOBFIX-13). Bản cũ dùng
  # expo/expo-github-action/fingerprint@v8 — action đó KHÔNG tính fingerprint của commit gốc mà
  # tra trong một DB sqlite cất ở Actions cache ("previous-fingerprint … may be null if not
  # computed previously"). Cache trả 400 và DB chưa từng được ghi ⇒ previous = null ⇒ diff = toàn
  # bộ ⇒ cảnh báo "runtime ĐỔI" ở MỌI PR (#525 thuần JS lẫn #526 chỉ sửa workflow đều bị). Guard
  # kêu nhầm liên tục thì không ai tin nó nữa. Bản này tự tính CẢ HAI phía bằng
  # `npx expo-updates fingerprint:generate --platform ios` — đúng thuật toán mà
  # `runtimeVersion.policy = fingerprint` dùng lúc EAS build (trên main 89988670 ra đúng
  # dfba226a… = runtime build 17). ĐỪNG thay bằng `npx @expo/fingerprint .`: nó ra số khác vì
  # thiếu platform/option (bẫy đã ghi trong handoff mobile §3.1).
  # Tuỳ chọn: đặt repo variable PROD_RUNTIME_FINGERPRINT = runtime của build đang phát hành → job
  # nói thêm HEAD còn khớp build đó không (OTA tới được hay không).
  # Informational (continue-on-error) — cảnh báo, không chặn merge và KHÔNG là required check.
  fingerprint-guard:
    name: 🫆 Fingerprint (cảnh báo đổi runtime)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Cần đủ lịch sử để dựng worktree tại commit gốc (base của PR / commit trước của push).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Fingerprint HEAD (ios)
        working-directory: ./mobile
        run: |
          npm ci
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fp-head.json"
          echo "HEAD: $(node -p "require('$RUNNER_TEMP/fp-head.json').hash")"

      - name: Fingerprint commit gốc (ios)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Không có commit gốc để so (push nhánh mới?) — bỏ qua phần so sánh."
            echo '{"hash":null,"sources":[]}' > "$RUNNER_TEMP/fp-base.json"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base/mobile"
          npm ci
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fp-base.json"
          echo "BASE ($BASE_SHA): $(node -p "require('$RUNNER_TEMP/fp-base.json').hash")"

      - name: So sánh và cảnh báo
        env:
          PROD_RUNTIME: ${{ vars.PROD_RUNTIME_FINGERPRINT }}
        run: |
          node - "$RUNNER_TEMP/fp-base.json" "$RUNNER_TEMP/fp-head.json" <<'JS'
          const fs = require('fs');
          const [baseFile, headFile] = process.argv.slice(2);
          const key = (s) => `${s.type}:${s.filePath ?? s.id ?? ''}`;
          const idx = (fp) => Object.fromEntries((fp.sources ?? []).map((s) => [key(s), s.hash ?? '']));
          const base = JSON.parse(fs.readFileSync(baseFile, 'utf8'));
          const head = JSON.parse(fs.readFileSync(headFile, 'utf8'));
          const A = idx(base), B = idx(head);
          const changed = [...new Set([...Object.keys(A), ...Object.keys(B)])].filter((k) => A[k] !== B[k]).sort();
          const summary = [];
          const prod = (process.env.PROD_RUNTIME || '').trim();
          if (base.hash && base.hash !== head.hash) {
            console.log(`::warning title=Runtime fingerprint ĐỔI::PR này đổi native fingerprint (${base.hash.slice(0, 8)} → ${head.hash.slice(0, 8)}) — OTA từ sau khi merge sẽ KHÔNG tới các build cũ; cần cắt build native mới để giao thay đổi JS tiếp theo.`);
            summary.push('### 🫆 Runtime fingerprint ĐỔI', `- previous: \`${base.hash}\``, `- current:  \`${head.hash}\``, '- nguồn đổi:', ...changed.map((c) => `  - \`${c}\``), '', 'OTA sau merge sẽ không tới build cũ — lên kế hoạch cắt build native.');
          } else if (base.hash) {
            console.log(`::notice title=Runtime fingerprint giữ nguyên::${head.hash}`);
            summary.push('### 🫆 Runtime fingerprint giữ nguyên', `- \`${head.hash}\``);
          } else {
            summary.push('### 🫆 Không có commit gốc để so', `- HEAD: \`${head.hash}\``);
          }
          if (prod) {
            const ok = prod === head.hash;
            summary.push('', ok ? `✅ HEAD khớp runtime đang phát hành (\`${prod.slice(0, 8)}\`) — OTA từ nhánh này tới được build đó.` : `⚠️ HEAD KHÁC runtime đang phát hành \`${prod.slice(0, 8)}\` — OTA từ nhánh này KHÔNG tới build đó.`);
            if (!ok) console.log(`::warning title=Lệch runtime đang phát hành::HEAD ${head.hash.slice(0, 8)} ≠ PROD_RUNTIME_FINGERPRINT ${prod.slice(0, 8)}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          JS
