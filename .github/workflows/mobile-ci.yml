name: Mobile CI

on:
  push:
    branches: [ "main", "dev", "feat/onboarding-v3" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
#
# `feat/onboarding-v3` là nhánh dài hạn của dự án onboarding onb_v3: các đợt GĐ 1–8
# PR VÀO nó chứ không vào main. Không liệt kê ở đây thì workflow không kích hoạt cho
# những PR đó, và chúng merge mà KHÔNG có cổng nào — nguy nhất là GĐ 5 (viết lại web
# onboarding), vốn thuần frontend. Gỡ dòng này khi nhánh dài hạn đã merge xong.
  pull_request:
    branches: [ "main", "dev", "feat/onboarding-v3" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check-and-test:
    name: 🧪 Type Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Unit Tests
        working-directory: ./mobile
        run: npm test
