server:
  http_listen_port: 9080
  grpc_listen_port: 0

# H2 audit lag 02/09: positions nằm /tmp TRONG container = mất mỗi lần restart → promtail đọc
# lại toàn bộ log từ đầu, đẩy trùng vào Loki. /positions là volume promtail_positions (compose).
positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
    - targets:
        - localhost
      labels:
        job: varlogs
        __path__: /var/log/*log

  - job_name: containers
    static_configs:
    - targets:
        - localhost
      labels:
        job: containerlogs
        __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - docker: {}
