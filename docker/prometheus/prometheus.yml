global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

# Send firing alerts to Alertmanager (which fans them out to Telegram).
# Without this block, the rules in alert.rules.yml fire but go nowhere — which is why
# the DB-pool exhaustion incident produced no notification.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend chạy blue-green trên VM tự host (deploy/self-host/deploy-backend-vm.sh): màu blue là
  # container deutschflow-backend, màu green là deutschflow-backend-green. Lúc nào cũng chỉ MỘT màu
  # sống (màu kia bị gỡ sau khi đổi traffic) ⇒ scrape cả hai tên; target của màu đã gỡ báo down là
  # BÌNH THƯỜNG — rule BackendScrapeDown xét max() trên cả job nên chỉ kêu khi CẢ HAI cùng chết.
  # deploy-backend-vm.sh gắn container mới vào mạng deutschflow-net và SIGHUP Prometheus.
  - job_name: 'deutschflow-backend'
    metrics_path: '/actuator/prometheus'
    # /actuator/prometheus được bảo vệ bằng bearer token tĩnh ở tầng app (401 nếu thiếu/sai).
    # Token nằm ngoài repo: /home/deploy/secrets/prometheus_scrape_token trên VM, mount vào
    # /etc/prometheus-secrets/scrape-token (deploy/self-host/monitoring.compose.yml), cùng giá trị
    # PROMETHEUS_SCRAPE_TOKEN trong /srv/deutschflow/env/backend.env.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/scrape-token
    static_configs:
      - targets: ['deutschflow-backend:8080', 'deutschflow-backend-green:8080']

  # H3 audit lag 02/09: số đo HOST (CPU/RAM/disk/swap/network của cả EC2 — nginx, redis, dockerd
  # đều nằm ngoài tầm /actuator). Service node-exporter trong docker-compose.prod.yml, scrape qua
  # DNS nội mạng deutschflow-net, không publish cổng nào.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
