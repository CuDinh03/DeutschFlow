# ============================================================
# Nginx Reverse Proxy — DeutschFlow Production
#
# Cài đặt trên EC2:
#   sudo apt install nginx certbot python3-certbot-nginx -y
#   sudo cp deutschflow.nginx.conf /etc/nginx/sites-available/deutschflow
#   sudo ln -s /etc/nginx/sites-available/deutschflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sau đó cài SSL (thay tên miền thật vào):
#   sudo certbot --nginx -d deutschflow.com -d www.deutschflow.com -d api.deutschflow.com
# ============================================================

# ── Rate limiting (tầng http) ────────────────────────────────
# Đặt được ở đây vì Debian/Ubuntu include sites-enabled/* BÊN TRONG khối http{} —
# limit_req_zone/limit_conn_zone là directive tầng http, để trong server{} sẽ nginx -t đỏ.
#
# Vì sao cần dù app đã có rate-limit riêng: throttle ở app chạy SAU khi request đã chiếm một
# Tomcat thread. Chặn ở nginx cắt rác trước khi nó vào JVM. Hai lớp bổ sung nhau, không thay nhau.
#
# ⚠️ Chỉ có tác dụng với lưu lượng THỰC SỰ đi qua nginx. Backend phải chỉ nhận request qua
#    reverse proxy này, không nhận trực tiếp từ ngoài — nếu không thì toàn bộ khối này là trang trí.
#
# ── H1 (audit lag 02/09): Cloudflare đã đứng TRƯỚC nginx từ đợt DDoS 24/08 ──────────────────
# Không có khối real_ip thì $binary_remote_addr = IP EDGE của Cloudflare ⇒ toàn bộ người dùng
# dùng CHUNG vài xô rate-limit của IP edge — nghẽn oan hàng loạt đúng giờ đông (một hình dạng
# của lag đang truy). Khối dưới đổi $remote_addr về IP thật của client qua CF-Connecting-IP,
# và CHỈ tin header đó khi kết nối đến từ đúng dải IP Cloudflare (set_real_ip_from) — ai vòng
# qua CF gõ thẳng origin thì header tự khai bị BỎ QUA, không spoof được.
# Hệ quả dây chuyền đã rà:
#   • proxy_set_header X-Real-IP/$proxy_add_x_forwarded_for chạy SAU real_ip ⇒ backend nhận
#     entry phải-nhất của XFF = IP thật ⇒ ClientIpResolver (trusted-proxy-count=1) ĐÚNG NGUYÊN
#     TRẠNG, không cần sửa Java — đây là lý do PR này không đụng backend.
#   • Dải IP: https://www.cloudflare.com/ips/ (ổn định nhiều năm; soát lại khi CF thông báo).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
#
# 🏫 Ngưỡng chọn THOÁNG có chủ đích: đây là sản phẩm B2B cho trường/trung tâm, cả một lớp ngồi
#    sau MỘT địa chỉ NAT của trường (hoặc CGNAT nhà mạng) là chuyện thường. Chặn oan cả lớp tệ
#    hơn nhiều so với để lọt một kẻ tấn công đơn lẻ — lớp chặn tinh nằm ở tầng app.
limit_req_zone  $binary_remote_addr zone=df_auth:10m rate=3r/s;
limit_req_zone  $binary_remote_addr zone=df_api:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=df_conn:10m;

# Mặc định nginx trả 503 cho limit_req — sai ngữ nghĩa và làm client/retry hiểu nhầm là server
# lỗi. 429 mới đúng, và khớp với 429 mà app trả cho rate-limit tầng ứng dụng.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ── Frontend: deutschflow.com ────────────────────────────────
server {
    listen 80;
    server_name mydeutschflow.com www.mydeutschflow.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mydeutschflow.com www.mydeutschflow.com;

    # Certbot sẽ tự điền 2 dòng ssl_certificate này
    # ssl_certificate /etc/letsencrypt/live/mydeutschflow.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mydeutschflow.com/privkey.pem;

    # Tăng cường bảo mật TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "microphone=(self), camera=()";

    # Giới hạn upload size (cho STT audio recording)
    client_max_body_size 16M;

    # Cùng trần với API. Khối này hiện gần như không nhận lưu lượng thật: bản ghi DNS của
    # mydeutschflow.com đang trỏ vào CDN, nên chỉ ai gõ thẳng IP kèm Host header mới rơi vào đây.
    # ⚠️ Nếu sau này cho CDN lấy origin là chính nginx này thì PHẢI khai set_real_ip_from trước
    #    (xem ghi chú ở đầu file) — nếu không, mọi người dùng sẽ dùng chung xô của IP edge và bị
    #    chặn oan hàng loạt.
    limit_req  zone=df_api burst=100 nodelay;
    limit_conn df_conn 150;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend API: api.mydeutschflow.com ──────────────────────
server {
    listen 80;
    server_name api.mydeutschflow.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mydeutschflow.com;

    # ssl_certificate /etc/letsencrypt/live/api.mydeutschflow.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.mydeutschflow.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Upload multipart qua backend: Materials Library nâng lên 25MB (khớp spring.servlet.multipart).
    # Tệp >25MB KHÔNG đi qua đây — client PUT thẳng lên S3 bằng presigned URL. Nếu để 10M thì nginx
    # 413 trước khi request tới Spring và handler MaxUploadSizeExceeded không bao giờ chạy.
    client_max_body_size 25M;

    # Cài đặt proxy dùng chung — mọi location bên dưới KẾ THỪA khối này, nên không phải lặp lại.
    # ⚠️ Nếu một location tự khai proxy_set_header thì nó VỨT toàn bộ header kế thừa (quy tắc mảng
    #    của nginx) và phải khai lại đủ cả bốn dòng. Hiện không location nào làm vậy.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Trần chung cho toàn API: cầu dao chống flood, KHÔNG phải throttle tinh.
    # 50r/s + burst 100 nghe rất rộng, và đúng là cố ý: một lớp 30 học viên cùng mở dashboard sau
    # NAT của trường có thể bắn hàng trăm request trong vài giây, và tất cả dùng CHUNG một IP.
    # Siết chặt ở đây là chặn oan cả lớp. Việc chặn tinh do app làm (khoá theo userId/email).
    limit_req zone=df_api burst=100 nodelay;

    # Chống slowloris / vét cạn kết nối từ một máy. 150 cao có chủ ý:
    # SSE giữ MỘT kết nối mở tới 15 phút cho mỗi tab đang mở (/api/notifications/stream,
    # /api/jobs/{id}/sse, /api/ai-speaking/sessions/{id}/chat/stream) — cộng ~6 kết nối/trình duyệt,
    # một lớp sau NAT chạm ngưỡng rất nhanh. Triệu chứng khi đặt thấp: học viên mất thông báo
    # realtime và thấy 429 rải rác dù thao tác bình thường ⇒ nâng số này, đừng tắt SSE.
    limit_conn df_conn 150;

    # Actuator: chặn endpoint quản trị khỏi internet (defense-in-depth, audit INF-2).
    # Chỉ để hở /actuator/health cho uptime monitor ngoài (chỉ trả status khi chưa auth);
    # env/metrics/prometheus/info... đã ADMIN-gate ở app — chặn thêm ở edge cho chắc.
    # (Prometheus container scrape backend:8080 qua mạng Docker nội bộ, KHÔNG qua nginx → không ảnh hưởng.)
    # Kế thừa df_api: monitor poll 10s/lần thì cách ngưỡng rất xa, nhưng /actuator/health có chạm DB
    # nên không để nó hoàn toàn không giới hạn.
    location = /actuator/health {
        proxy_pass http://localhost:8080;
    }
    location /actuator/ {
        deny all;
    }

    # Nhóm endpoint auth — siết chặt hơn hẳn phần còn lại vì đây là chỗ ĐẮT nhất:
    #   • login  : mỗi lần thử tốn trọn một lần BCrypt (~50-100ms CPU) KỂ CẢ khi email không tồn tại,
    #              do DaoAuthenticationProvider hash đối chiếu hash giả cho user lạ.
    #   • register: cũng BCrypt (encode).
    #   • forgot/reset-password: gửi email + brute-force OTP 6 chữ số.
    # 3r/s + burst 30: cả lớp cùng đăng nhập lúc 8h sáng vẫn lọt trọn (30 request tới cùng lúc được
    # burst nuốt hết), nhưng flood liên tục thì bị cắt NGAY tại nginx, không tốn Tomcat thread nào.
    # Khai lại cả df_api vì directive limit_req ở location THAY THẾ toàn bộ cái kế thừa từ server.
    location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password)$ {
        limit_req zone=df_auth burst=30 nodelay;
        limit_req zone=df_api  burst=100 nodelay;
        proxy_pass http://localhost:8080;
    }

    location / {
        proxy_pass http://localhost:8080;

        # SSE (Server-Sent Events) — cần tắt buffering để stream realtime
        proxy_buffering off;
        proxy_read_timeout 90s;  # Đủ cho SSE long-polling
    }
}
