# Integration tests: real PostgreSQL via Testcontainers (see AbstractPostgresIntegrationTest).
# Do not add H2 or classpath schema-test.sql on this branch.

spring:
  datasource:
    # Satisfies application.yml env placeholders until @DynamicPropertySource overrides these.
    url: jdbc:postgresql://127.0.0.1:5432/deutschflow_test_placeholder
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # Pool nhỏ cho IT: production dùng tối đa 30 và giữ sẵn 5 kết nối rảnh MỖI context. Bộ IT cache
    # nhiều ApplicationContext trên một Postgres dùng chung, nên các pool rảnh cộng lại chạm trần
    # max_connections ("too many clients already"). Context không chạy test trả hết kết nối về 0.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  sql:
    init:
      mode: never

storage:
  s3:
    endpoint: https://test-account.r2.cloudflarestorage.com
    bucket-name: deutschflow-test-media
    region: auto
    access-key: test-access-key
    secret-key: test-secret-key

app:
  features:
    # Production mặc định TẮT buổi học 1:1; test bật để các ca hiện có của tính năng vẫn chạy.
    teacher-sessions-enabled: true
  flyway:
    repair-before-migrate: false
  maintenance:
    # Cache trạng thái bảo trì (MaintenanceStateService) trong test chỉ được đổi qua refreshNow()
    # tường minh. Nhịp refresh NỀN 15 s là nguồn đua: nó đọc DB lúc một test còn giữ cửa sổ ACTIVE
    # rồi ghi snapshot SAU khi @AfterEach đã deleteAll() + refreshNow() ⇒ mọi lớp chạy sau 503 hàng
    # loạt (CI 17/09/2026, run 35227627362). Lớp nền AbstractPostgresIntegrationTest còn dọn thêm
    # trước mỗi test; hai lớp phòng thủ, không lớp nào tin lớp kia.
    state-refresh-ms: 3600000
    state-initial-delay-ms: 3600000
  jwt:
    secret: test-secret-key-with-at-least-32-bytes!!
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  speaking:
    adaptive:
      enabled: true
  vocabulary:
    deepl-lemma-backfill:
      enabled: false
    enrichment-auto-stop-enabled: false
    goethe:
      auto-import-on-startup: false
      official-wordlist:
        auto-import-on-startup: false
    cefr-curated:
      auto-import-on-startup: false
      enrich-after-upsert: false
    wiktionary-scheduler:
      enabled: false
    glosbe-vi:
      enabled: false
