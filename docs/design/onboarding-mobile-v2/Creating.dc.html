<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; color: #161513; -webkit-font-smoothing: antialiased; }
    a { color: #C79A00; text-decoration: none; }
    a:hover { color: #161513; }
    @keyframes dfSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .df-spin { animation: none; } }
    .df-spin { animation: dfSpin 1.1s linear infinite; transform-origin: center; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FBFAF7; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 36px; gap: 26px;">

    <!-- avatar in progress ring -->
    <div style="position: relative; width: 108px; height: 108px; display: flex; align-items: center; justify-content: center;">
      <svg width="108" height="108" viewBox="0 0 108 108" fill="none" style="position: absolute; top: 0; left: 0;">
        <circle cx="54" cy="54" r="50" stroke="#E7E3DA" stroke-width="5"></circle>
        <circle class="df-spin" cx="54" cy="54" r="50" stroke="#C79A00" stroke-width="5" stroke-linecap="butt" stroke-dasharray="230 84" transform="rotate(-90 54 54)"></circle>
      </svg>
      <div style="width: 64px; height: 64px; border-radius: 4px; background: #161513; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; color: #FFCD00;">J</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 25px; line-height: 1.18; letter-spacing: -0.02em;">Đang tạo lộ trình của bạn…</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #76716A;">Chỉ vài giây — đừng đóng ứng dụng.</p>
    </div>

    <!-- progress checklist -->
    <div style="width: 100%; background: #FFFFFF; border: 1px solid #E7E3DA; border-radius: 4px; display: flex; flex-direction: column;">

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EDEAE2;">
        <div style="width: 22px; height: 22px; border-radius: 50%; background: #1E9E61; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Mục tiêu &amp; trình độ — đã lưu</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EDEAE2;">
        <div style="width: 22px; height: 22px; border-radius: 50%; background: #1E9E61; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Mentor Jonas — đã ghép</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
        <svg class="df-spin" width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
          <circle cx="12" cy="12" r="9" stroke="#E7E3DA" stroke-width="2.4"></circle>
          <path d="M21 12a9 9 0 0 0-9-9" stroke="#C79A00" stroke-width="2.4" stroke-linecap="round"></path>
        </svg>
        <span style="font-size: 13.5px; font-weight: 500;">Dựng 46 chặng A0 → B1…</span>
      </div>

    </div>

    <!-- brand mark, quiet -->
    <div style="display: flex; align-items: center; gap: 8px; opacity: 0.65;">
      <svg width="18" height="18" viewBox="0 0 100 100" fill="none">
        <path d="M 20 18 L 20 82 L 52 82 L 74 62 L 74 38 L 52 18 Z" stroke="#161513" stroke-width="6" stroke-linejoin="miter" fill="none"></path>
        <polygon points="52,38 74,50 52,62" fill="#DA291C"></polygon>
        <rect x="24" y="45" width="9" height="9" fill="#FFCD00"></rect>
      </svg>
      <span style="font: 600 10.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #76716A;">DeutschFlow</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
