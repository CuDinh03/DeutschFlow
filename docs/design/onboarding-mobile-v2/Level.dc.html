<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; color: #161513; -webkit-font-smoothing: antialiased; }
    a { color: #C79A00; text-decoration: none; }
    a:hover { color: #161513; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FBFAF7; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- header: back + segmented progress (step 2/4) -->
  <div style="padding-top: 58px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 20px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-left: -4px;">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <div style="display: flex; gap: 5px; flex: 1;">
        <div style="flex: 1; height: 5px; border-radius: 3px; background: #FFCD00;"></div>
        <div style="flex: 1; height: 5px; border-radius: 3px; background: #FFCD00;"></div>
        <div style="flex: 1; height: 5px; border-radius: 3px; background: #E7E3DA;"></div>
        <div style="flex: 1; height: 5px; border-radius: 3px; background: #E7E3DA;"></div>
      </div>
      <span style="font: 600 13px/1 'Instrument Sans', sans-serif; color: #76716A; font-variant-numeric: tabular-nums;">2/4</span>
    </div>
  </div>

  <!-- title block -->
  <div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 9px; flex-shrink: 0;">
    <div style="font: 600 10.5px/1.3 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #76716A;">Bước 2 / 4 · Trình độ</div>
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 28px; line-height: 1.16; letter-spacing: -0.02em;">Bạn đang ở đâu — và muốn tới đâu?</h1>
  </div>

  <div style="flex: 1; padding: 20px 24px 12px; overflow: hidden; display: flex; flex-direction: column; gap: 22px;">

    <!-- current level -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font: 600 10.5px/1.3 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #76716A;">Hiện tại</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="padding: 11px 15px; border-radius: 4px; background: rgba(255, 205, 0, 0.14); border: 1px solid #C79A00; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #161513;">Mới bắt đầu · A0</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">A1</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">A2</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">B1</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">B2</div>
      </div>
    </div>

    <!-- target level -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font: 600 10.5px/1.3 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #76716A;">Mục tiêu</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">A1</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">A2</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: rgba(255, 205, 0, 0.14); border: 1px solid #C79A00; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #161513;">B1</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">B2</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">C1</div>
        <div style="padding: 11px 15px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E7E3DA; font: 600 13.5px/1 'Instrument Sans', sans-serif; color: #76716A;">C2</div>
      </div>
    </div>

    <!-- journey preview: A0 → B1 -->
    <div style="background: #FFFFFF; border: 1px solid #E7E3DA; border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;">
          <span style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px; line-height: 1;">A0</span>
          <span style="font: 600 9.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #B3ADA5;">Hôm nay</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 0;">
          <div style="width: 7px; height: 7px; background: #FFCD00; flex-shrink: 0;"></div>
          <div style="flex: 1; height: 2px; background: repeating-linear-gradient(90deg, #C79A00 0, #C79A00 6px, transparent 6px, transparent 11px);"></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C79A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <line x1="4" y1="12" x2="19" y2="12"></line>
            <polyline points="13 6 19 12 13 18"></polyline>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;">
          <span style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px; line-height: 1; color: #C79A00;">B1</span>
          <span style="font: 600 9.5px/1 'Instrument Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #B3ADA5;">Mục tiêu</span>
        </div>
      </div>
      <div style="border-top: 1px solid #EDEAE2; padding-top: 12px; display: flex; align-items: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#76716A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span style="font-size: 12.5px; line-height: 1.45; color: #76716A;">Lộ trình 46 chặng · khoảng 11 tuần với nhịp học đều đặn.</span>
      </div>
    </div>

  </div>

  <!-- footer -->
  <div style="margin-top: auto; flex-shrink: 0; border-top: 1px solid #E7E3DA; background: #FFFFFF; padding: 14px 24px 30px;">
    <button style="display: flex; align-items: center; justify-content: center; gap: 9px; border: none; border-radius: 4px; background: #161513; color: #FBFAF7; font: 700 15.5px/1 'Instrument Sans', sans-serif; padding: 17px 22px; width: 100%; cursor: pointer;">
      <span style="width: 7px; height: 7px; background: #FFCD00; display: inline-block;"></span>
      <span>Tiếp tục</span>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
